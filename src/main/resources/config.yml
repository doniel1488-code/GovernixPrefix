# ============================================
#  GovernixPrefix — конфиг
# ============================================

# Приоритет префикса в LuckPerms
# (чем больше — тем приоритетнее, если у игрока несколько префиксов)
prefix-priority: 100

# Мин/макс длина префикса (без учёта цветов)
min-length: 2
max-length: 24

# Кулдаун между сменами (сек)
cooldown-seconds: 120

# Запрещённые слова (без учёта регистра)
blacklist:
  - "admin"
  - "moderator"
  - "owner"
  - "staff"
  - "server"
  - "console"

# Запрещённые символы
forbidden-chars:
  - "§"   # Нельзя вводить § напрямую, только &-коды

# ===== Ограничения по правам =====
restrictions:
  # Максимум &-цветов (0 = без ограничений)
  max-colors: 0

  # Максимум символов типа &l, &n и т.д.
  max-decorations: 3

  # Разрешать пустой префикс (только цвета без текста)
  allow-empty-text: false

# ===== Сообщения =====
messages:
  prefix: "&8[&bПрефикс&8] "
  no-permission: "&cУ тебя нет прав на смену префикса."
  usage: "&e/cprefix <текст> &7— установить префикс"
  usage-reset: "&e/cprefix reset &7— сбросить префикс"
  usage-admin: "&e/cprefix <ник> <текст> &7— установить другому"
  usage-admin-reset: "&e/cprefix reset <ник>"

  set-success: "&a✔ Префикс установлен: &f{prefix}"
  reset-success: "&a✔ Префикс сброшен."
  admin-set: "&a✔ Ты установил префикс игроку &f{player}&a: &f{prefix}"
  admin-reset: "&a✔ Ты сбросил префикс игроку &f{player}&a."
  admin-target-notify: "&a✔ Админ установил тебе префикс: &f{prefix}"

  too-short: "&cСлишком короткий префикс (мин. {min} символов)."
  too-long: "&cСлишком длинный префикс (макс. {max} символов)."
  contains-blacklist: "&cПрефикс содержит запрещённое слово: &f{word}"
  contains-forbidden-char: "&cПрефикс содержит запрещённый символ."
  no-color-perm: "&cУ тебя нет прав на &-цвета."
  no-hex-perm: "&cУ тебя нет прав на HEX-цвета."
  no-gradient-perm: "&cУ тебя нет прав на градиенты."
  no-bold-perm: "&cУ тебя нет прав на жирный шрифт."
  empty-text: "&cПрефикс не может быть пустым."

  cooldown: "&c⏳ Подожди &f{time} &cсек."
  player-not-found: "&cИгрок не найден."
  player-offline: "&cИгрок оффлайн."
  luckperms-error: "&cОшибка LuckPerms. Попробуй позже."
